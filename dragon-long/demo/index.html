<title>Dragon Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Plein écran : la scène 3D occupe tout, la carte d'identité en haut à gauche, les commandes en bas. Un seul univers sombre (vitrine nocturne). */
:root {
  color-scheme: dark;
  --bg: #120f12;
  --bg-glow: #2a1c1a;
  --ink: #f3ece2;
  --muted: #b5a99c;
  --jade: #3fa883;
  --gold: #e8b84f;
  --red: #c8432f;
  --panel: rgba(24, 19, 22, 0.78);
  --line: rgba(232, 184, 79, 0.28);
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--bg-glow), var(--bg) 70%);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.card {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 16px;
  max-width: min(440px, calc(100% - 32px));
  display: grid;
  gap: 6px;
  pointer-events: none;
}
.card h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(26px, 5vw, 40px);
  letter-spacing: 0.06em;
  color: var(--gold);
  text-wrap: balance;
}
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.facts b { color: var(--ink); font-weight: 700; }

.controls {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: max-content;
  max-width: calc(100% - 32px);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(8px);
}
.group { display: flex; flex-wrap: wrap; gap: 6px; }
.sep { width: 1px; background: var(--line); align-self: stretch; }
button {
  font: 600 13px/1 var(--body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
button:hover { border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #0d1a14; }

#status[hidden] { display: none; }
#status {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--display);
  letter-spacing: 0.08em;
  color: var(--muted);
  pointer-events: none;
  text-align: center;
  padding-inline: 16px;
}
.hint { position: fixed; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 20px); font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .hint { display: none; }
  .sep { display: none; }
}
</style>

<div id="stage"></div>

<header class="card">
  <h1>Dragon Long</h1>
  <p>Dragon chinois low-poly pour Roblox, version 19 avec squelette. Choisis une animation, fais-le tourner, zoome.</p>
  <div class="facts">
    <span><b>28 662</b> triangles</span>
    <span><b>58</b> studs de long</span>
    <span><b>40</b> os</span>
  </div>
</header>

<div class="hint">Glisser pour tourner · molette ou pincer pour zoomer</div>

<div id="status">Chargement du dragon…</div>

<nav class="controls" aria-label="Commandes de la démo">
  <div class="group" role="group" aria-label="Animation">
    <button data-mode="Idle" aria-pressed="true">Repos</button>
    <button data-mode="Fly" aria-pressed="false">Vol</button>
    <button data-mode="Dead" aria-pressed="false">Mort</button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="group" role="group" aria-label="Actions">
    <button data-action="Roar">Rugir</button>
    <button data-action="Bite">Mordre</button>
    <button data-action="Breath">Souffle</button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="group">
    <button id="btn-spin" aria-pressed="false">Rotation</button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="group" role="group" aria-label="Vues">
    <button data-view="trois">Trois-quarts</button>
    <button data-view="profil">Profil</button>
    <button data-view="face">Face</button>
    <button data-view="tete">Tête</button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="animator.js"></script>
<script src="effects.js"></script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const status = document.getElementById("status");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x120f12, 90, 190);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);

  // Lumière : ciel chaud / sol sombre, une lumière principale dorée et un contre-jour jade.
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x241a1c, 0.75));
  const key = new THREE.DirectionalLight(0xffe2b0, 1.5);
  key.position.set(30, 45, 40);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x5fd1a8, 0.7);
  rim.position.set(-35, 20, -40);
  scene.add(rim);

  // Socle : disque discret avec un halo, pour poser le dragon dans l'espace.
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(40, 64),
    new THREE.MeshBasicMaterial({ color: 0x0c0a0c, transparent: true, opacity: 0.6 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.5;
  scene.add(ground);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(39.4, 40, 96),
    new THREE.MeshBasicMaterial({ color: 0xe8b84f, transparent: true, opacity: 0.25 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -1.48;
  scene.add(ring);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 140;
  controls.maxPolarAngle = Math.PI * 0.62;

  const pivot = new THREE.Group();
  scene.add(pivot);

  // Os du squelette : pose de repos, puis l'animateur (le même calcul que le script Roblox) les fait bouger.
  const bones = {}, rest = {};
  const euler = new THREE.Euler(), quat = new THREE.Quaternion(), off = new THREE.Vector3();
  let anim = null, mouth = null;
  // Souffle de feu : particules qui sortent de la gueule pendant l'action « Souffle ».
  const breath = DragonEffects.createBreath(THREE, scene);
  const shock = DragonEffects.createShockwave(THREE, scene), shake = DragonEffects.createShake();
  const biteSparks = DragonEffects.createSparks(THREE, scene);
  // Cible de la morsure : une petite boule lumineuse placée au hasard devant le dragon (gauche, droite, haut, bas).
  const targetBall = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 1),
    new THREE.MeshBasicMaterial({ color: 0xff5a5a, transparent: true, opacity: 0.9 }));
  targetBall.visible = false;
  let targetLife = 0;
  const TARGETS = [[-8, 12, 28], [8, 12, 28], [0, 17, 27], [0, 7, 27], [0, 12, 30]];
  const shakeOff = new THREE.Vector3();
  const mouthW = new THREE.Vector3(), headQ = new THREE.Quaternion(), breathDir = new THREE.Vector3();
  function setBone(name, rx, ry, rz, ty, tz, tx) {
    const b = bones[name];
    if (!b) return;
    euler.set(rx, ry, rz, "XYZ");
    b.quaternion.copy(rest[name].q).multiply(quat.setFromEuler(euler));
    off.set(tx || 0, ty || 0, tz || 0).applyQuaternion(rest[name].q);
    b.position.copy(rest[name].p).add(off);
  }

  const views = {
    trois: { pos: [52, 26, 46], target: [0, 8, 0] },
    profil: { pos: [78, 12, 0], target: [0, 8, 0] },
    face: { pos: [0, 14, 70], target: [0, 9, 10] },
    tete: { pos: [16, 16, 46], target: [0, 13, 24] }
  };
  let tween = null;
  function goTo(name, instant) {
    const v = views[name];
    const to = { pos: new THREE.Vector3().fromArray(v.pos), target: new THREE.Vector3().fromArray(v.target) };
    if (instant || reduceMotion) {
      camera.position.copy(to.pos);
      controls.target.copy(to.target);
      controls.update();
      return;
    }
    tween = { from: { pos: camera.position.clone(), target: controls.target.clone() }, to: to, t: 0 };
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 600 ? 50 : 38;
    camera.updateProjectionMatrix();
    breath.setScale(h * 0.03);
    biteSparks.setScale(h * 0.03);
  }
  window.addEventListener("resize", resize);
  resize();
  goTo("trois", true);

  // Le modèle est joint à la page encodé en base64 (dragon_v19_rig.txt) : on le décode puis on le lit comme un .glb.
  function onModel(gltf) {
    const model = gltf.scene;
    model.traverse(function (o) {
      if (o.isMesh) {
        const m = o.material;
        // Les couleurs du fichier sont en sRGB (comme dans Roblox) : on les passe en linéaire pour le rendu.
        m.color.convertSRGBToLinear();
        if (m.emissive) m.emissive.convertSRGBToLinear();
        if (o.name.indexOf("Eyes") === 0 || (m.emissive && m.emissive.getHex() !== 0)) m.emissiveIntensity = 1.6;
        if (o.name.indexOf("Fins") === 0 || o.name.indexOf("Whiskers") === 0) m.side = THREE.DoubleSide;
        m.flatShading = true;
        o.frustumCulled = false;
      }
      if (o.isBone) {
        bones[o.name] = o;
        rest[o.name] = { q: o.quaternion.clone(), p: o.position.clone() };
      }
    });
    anim = DragonAnimator.create(bones, setBone);
    const tongue = [];
    model.traverse(function (o) { if (o.isMesh && o.name.indexOf("Tongue") === 0) tongue.push(o); });
    mouth = DragonEffects.mouthInHead(THREE, tongue, bones.Head);
    pivot.add(model);
    status.hidden = true;
  }
  function onError() {
    status.textContent = "Le modèle n'a pas pu être chargé. Recharge la page pour réessayer.";
  }
  fetch("dragon_v19_rig.txt")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (b64) {
      const bin = atob(b64.trim());
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      new THREE.GLTFLoader().parse(bytes.buffer, "", onModel, onError);
    })
    .catch(onError);

  // Commandes
  const btnSpin = document.getElementById("btn-spin");
  let spin = false, mode = "Idle";
  btnSpin.addEventListener("click", function () {
    spin = !spin;
    btnSpin.setAttribute("aria-pressed", String(spin));
  });
  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () {
      mode = b.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
    });
  });
  document.querySelectorAll("[data-action]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!anim) return;
      if (b.dataset.action !== "Bite") return anim.play(b.dataset.action);
      // Morsure : on pose une cible au hasard devant lui, il vise la tête vers elle.
      const t = TARGETS[(Math.random() * TARGETS.length) | 0];
      if (!targetBall.parent) pivot.add(targetBall);
      targetBall.position.set(t[0], t[1], t[2]);
      targetLife = 1.6;
      scene.updateMatrixWorld();
      const aim = DragonEffects.aimAt(THREE, pivot, bones.Head, targetBall.getWorldPosition(new THREE.Vector3()));
      anim.play("Bite", aim[0], aim[1]);
    });
  });
  document.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { goTo(b.dataset.view); });
  });
  controls.addEventListener("start", function () { tween = null; });

  const clock = new THREE.Clock();
  let flyW = 0, flyAngle = 0, spinYaw = 0, yaw = 0;
  const followVec = new THREE.Vector3(), followPrev = new THREE.Vector3(), followOffset = new THREE.Vector3(0, 8, 0);
  const pathPos = new THREE.Vector3(), lastPos = new THREE.Vector3();
  // Parcours en 8 : le dragon tourne à gauche puis à droite, pour montrer les virages.
  function eight(a, R, out) { return out.set(R * Math.sin(a), 0, R * Math.sin(a) * Math.cos(a)); }
  function wrap(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
  function loop() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (spin) spinYaw += dt * 0.25;
    // En vol, le dragon se déplace sur un grand 8 ; la caméra le suit.
    flyW += ((mode === "Fly" ? 1 : 0) - flyW) * Math.min(1, dt * 0.8);
    flyAngle += dt * 0.22 * flyW;
    pathPos.copy(eight(flyAngle, 42, followVec).multiplyScalar(flyW));
    pathPos.y = 7 * flyW + 2.5 * flyW * Math.sin(flyAngle * 2.3);
    const vx = (pathPos.x - lastPos.x) / Math.max(dt, 1e-4), vz = (pathPos.z - lastPos.z) / Math.max(dt, 1e-4);
    lastPos.copy(pathPos);
    const moving = Math.hypot(vx, vz) > 0.6;
    const targetYaw = moving ? Math.atan2(vx, vz) : spinYaw;
    const prevYaw = yaw;
    yaw += wrap(targetYaw - yaw) * Math.min(1, dt * (moving ? 6 : 1.5));
    // Vitesse de virage donnée à l'animateur (le tour sur soi-même de « Rotation » n'en est pas un).
    const turn = moving && dt > 0 ? wrap(yaw - prevYaw) / dt : 0;
    if (anim) {
      anim.update(reduceMotion ? 0 : dt, mode, turn);
      if (mouth) {
        scene.updateMatrixWorld();
        mouthW.copy(mouth);
        bones.Head.localToWorld(mouthW);
        bones.Head.getWorldQuaternion(headQ);
        breathDir.set(0, -0.12, 1).applyQuaternion(headQ).normalize();
        breath.update(reduceMotion ? 0 : dt, anim.state.breath, mouthW, breathDir);
        // Rugissement : onde de choc et tremblement de la caméra à l'instant du cri.
        if (anim.state.burst === "Roar" && !reduceMotion) {
          shock.trigger(mouthW, breathDir, "#FFB070");
          shake.trigger(0.9);
        }
        if (anim.state.burst === "Bite" && !reduceMotion) {   // claquement des crocs : étincelles, petite secousse
          biteSparks.trigger(mouthW, "#FFB070");
          shake.trigger(0.35);
        }
      }
    }
    pivot.position.copy(pathPos);
    pivot.rotation.set(0, yaw, 0, "YXZ");
    if (flyW > 0.01 && !tween) {
      const before = followPrev.copy(controls.target);
      controls.target.lerp(followVec.copy(pivot.position).add(followOffset), Math.min(1, dt * 2.5));
      camera.position.add(before.subVectors(controls.target, before));
    }
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 1.1);
      const e = tween.t < 0.5 ? 4 * tween.t * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 3) / 2;
      camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
      controls.target.lerpVectors(tween.from.target, tween.to.target, e);
      if (tween.t >= 1) tween = null;
    }
    controls.update();
    shock.update(reduceMotion ? 0 : dt);
    biteSparks.update(reduceMotion ? 0 : dt);
    targetLife -= dt;
    targetBall.visible = targetLife > 0;
    shake.offset(dt, shakeOff);                // la caméra tremble un instant, puis revient à sa place
    camera.position.add(shakeOff);
    renderer.render(scene, camera);
    camera.position.sub(shakeOff);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
